<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish | Crom Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { crom: { DEFAULT: '#00d2ff', light: '#3a7bd5' }, surface: { 900: '#0a0a0f', 800: '#0f0c29', 700: '#12121a', 600: '#1a1a25' } }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #0f0c29 40%, #1a1030 100%);
            background-attachment: fixed;
        }
    </style>
</head>

<body class="font-sans text-gray-100 min-h-screen">

    <!-- Top Nav -->
    <nav
        class="sticky top-0 z-50 flex items-center justify-between px-4 md:px-8 py-4 bg-surface-900/80 backdrop-blur-xl border-b border-white/5">
        <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition text-sm">
            <span>←</span> Back to Feed
        </a>
        <span class="text-lg font-bold bg-gradient-to-r from-crom to-crom-light bg-clip-text text-transparent">📢
            Publish</span>
        <div class="w-20"></div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">
        <!-- Auth Warning -->
        <div id="auth-warning"
            class="hidden text-center py-10 px-6 bg-red-500/5 border border-red-500/30 rounded-2xl mb-6">
            <h2 class="text-xl font-bold text-red-400 mb-2">🔒 Authentication Required</h2>
            <p class="text-gray-400 mb-4">You must login to publish to the network.</p>
            <button onclick="showLogin()"
                class="px-6 py-2.5 rounded-lg bg-crom text-black font-semibold hover:opacity-90 transition">Login / Sign
                Up</button>
        </div>

        <!-- Publish Form -->
        <div id="publish-form" class="bg-white/[0.03] border border-white/[0.06] rounded-2xl p-6 md:p-8 space-y-6">
            <h2 class="text-xl font-bold text-white">Create Content</h2>

            <!-- Kind Selector -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Content Type</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="kind-grid">
                    <button onclick="selectKind('text')" data-kind="text"
                        class="kind-btn flex flex-col items-center gap-1 px-4 py-3 rounded-xl border-2 border-crom bg-crom/10 text-crom text-sm font-medium transition">
                        <span class="text-2xl">📝</span> Text
                    </button>
                    <button onclick="selectKind('article')" data-kind="article"
                        class="kind-btn flex flex-col items-center gap-1 px-4 py-3 rounded-xl border-2 border-white/10 bg-white/[0.03] text-gray-400 hover:border-white/20 text-sm font-medium transition">
                        <span class="text-2xl">📰</span> Article
                    </button>
                    <button onclick="selectKind('video')" data-kind="video"
                        class="kind-btn flex flex-col items-center gap-1 px-4 py-3 rounded-xl border-2 border-white/10 bg-white/[0.03] text-gray-400 hover:border-white/20 text-sm font-medium transition">
                        <span class="text-2xl">📹</span> Video
                    </button>
                    <button onclick="selectKind('image')" data-kind="image"
                        class="kind-btn flex flex-col items-center gap-1 px-4 py-3 rounded-xl border-2 border-white/10 bg-white/[0.03] text-gray-400 hover:border-white/20 text-sm font-medium transition">
                        <span class="text-2xl">📸</span> Image
                    </button>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Title <span class="text-gray-600">(optional
                        for micro-posts)</span></label>
                <input type="text" id="title" placeholder="Give it a title…"
                    class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-crom/50 focus:outline-none focus:ring-1 focus:ring-crom/30 transition">
            </div>

            <!-- URL Fields (Video/Image) -->
            <div id="url-group" class="hidden space-y-3">
                <label class="block text-sm font-medium text-gray-400 mb-2" id="url-label">Media URL</label>
                <input type="text" id="url" placeholder="https://..."
                    class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-crom/50 focus:outline-none focus:ring-1 focus:ring-crom/30 transition">
                <input type="text" id="thumbnail" placeholder="Thumbnail URL (optional)"
                    class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-crom/50 focus:outline-none focus:ring-1 focus:ring-crom/30 transition">
            </div>

            <!-- Content -->
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Content</label>
                <textarea id="content" rows="5" placeholder="What's happening?"
                    class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-crom/50 focus:outline-none focus:ring-1 focus:ring-crom/30 transition resize-none"></textarea>
                <div class="text-right mt-1 text-xs text-gray-600"><span id="char-count">0</span> chars</div>
            </div>

            <!-- Submit -->
            <button onclick="publish()"
                class="w-full py-3.5 rounded-xl bg-gradient-to-r from-crom to-crom-light text-black font-bold text-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-crom/20">
                Publish to Network 🚀
            </button>
        </div>
    </div>

    <!-- SDK -->
    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_server.js"></script>
    <script>
        // Init SDK client (publish.html doesn't load app.js)
        document.addEventListener('DOMContentLoaded', () => {
            const baseUrl = window.serverManager ? window.serverManager.currentServer : window.location.origin;
            if (!window.cromClient) window.cromClient = new CromClient(baseUrl);
        });
    </script>

    <script>
        let selectedKind = 'text';

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (!window.cromAuth || !window.cromAuth.keyPair) {
                    document.getElementById('auth-warning').classList.remove('hidden');
                    document.getElementById('publish-form').classList.add('hidden');
                }
            }, 500);
            document.getElementById('content').addEventListener('input', e => {
                document.getElementById('char-count').textContent = e.target.value.length;
            });
        });

        function selectKind(kind) {
            selectedKind = kind;
            document.querySelectorAll('.kind-btn').forEach(b => {
                b.classList.remove('border-crom', 'bg-crom/10', 'text-crom');
                b.classList.add('border-white/10', 'bg-white/[0.03]', 'text-gray-400');
            });
            const active = document.querySelector(`[data-kind="${kind}"]`);
            active.classList.add('border-crom', 'bg-crom/10', 'text-crom');
            active.classList.remove('border-white/10', 'bg-white/[0.03]', 'text-gray-400');

            const urlGroup = document.getElementById('url-group');
            const thumb = document.getElementById('thumbnail');
            if (kind === 'video') {
                urlGroup.classList.remove('hidden');
                document.getElementById('url-label').textContent = 'Video URL';
                thumb.classList.remove('hidden');
            } else if (kind === 'image') {
                urlGroup.classList.remove('hidden');
                document.getElementById('url-label').textContent = 'Image URL';
                thumb.classList.add('hidden');
            } else {
                urlGroup.classList.add('hidden');
            }
        }

        async function publish() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const url = document.getElementById('url').value;
            const thumbnail = document.getElementById('thumbnail').value;

            if (!content && !title && !url) return alert("Content cannot be empty");

            const payload = { title, content, timestamp: Date.now() };
            if (selectedKind === 'video') { payload.url = url; payload.thumbnail = thumbnail; }
            else if (selectedKind === 'image') { payload.url = url; }

            try {
                const result = await signAndSend(selectedKind, payload);
                if (result.status === 'published') {
                    alert("Published Successfully! ID: " + result.id);
                    window.location.href = 'index.html';
                }
            } catch (e) {
                alert("Publish Failed: " + e.message);
                console.error(e);
            }
        }

        async function signAndSend(kind, payloadObj) {
            const auth = window.cromAuth;
            const client = window.cromClient;
            const timestamp = Math.floor(Date.now() / 1000);
            const authorHex = auth.pubKeyHex;
            const networkId = 'meueu-mainnet-v1';
            const nonce = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

            // The backend VerifySignature uses strict TLV binary format.
            // The auth.sign(message) signs raw bytes. We need to construct
            // the same canonical message the backend will reconstruct.
            // For now, we use the simple canonical string that auth.sign expects.
            const canonical = `version:1|author:${authorHex}|kind:${kind}|timestamp:${timestamp}|payload:${JSON.stringify(payloadObj)}`;
            const signature = auth.sign(canonical);

            return await client.publish({
                author_pubkey: authorHex,
                kind: kind,
                payload: payloadObj,
                claimed_at: new Date().toISOString(),
                signature: signature,
                network_id: networkId,
                nonce: nonce
            });
        }
    </script>
</body>

</html>
