<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Inbox | Crom Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { crom: { DEFAULT: '#00d2ff', light: '#3a7bd5' }, surface: { 900: '#0a0a0f', 700: '#12121a', 600: '#1a1a25' } }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #0f0c29 40%, #1a1030 100%);
            background-attachment: fixed;
        }
    </style>
</head>

<body class="font-sans text-gray-100 min-h-screen">

    <nav
        class="sticky top-0 z-50 flex items-center justify-between px-4 md:px-8 py-4 bg-surface-900/80 backdrop-blur-xl border-b border-white/5">
        <a href="index.html"
            class="text-gray-400 hover:text-white transition text-sm flex items-center gap-1"><span>←</span> Feed</a>
        <span class="text-lg font-bold bg-gradient-to-r from-crom to-crom-light bg-clip-text text-transparent">🔐 Secure
            Inbox</span>
        <div class="w-16"></div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-8">
        <!-- Compose -->
        <div class="bg-white/[0.03] border border-white/[0.06] rounded-2xl p-6 mb-8">
            <h3 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">✉️ New Encrypted Message</h3>
            <input type="text" id="recipient" placeholder="Recipient Public Key (hex)"
                class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-mono placeholder-gray-500 focus:border-crom/50 focus:outline-none focus:ring-1 focus:ring-crom/30 transition mb-3">
            <textarea id="message" rows="3" placeholder="Secret message…"
                class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-500 focus:border-crom/50 focus:outline-none focus:ring-1 focus:ring-crom/30 transition resize-none mb-3"></textarea>
            <button onclick="send()"
                class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-gradient-to-r from-crom to-crom-light text-black font-semibold text-sm hover:opacity-90 transition">Encrypt
                & Send 🚀</button>
        </div>

        <!-- Inbox -->
        <h3 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider">Inbox</h3>
        <div id="inbox-list" class="space-y-3">
            <div class="text-center text-gray-500 py-10 text-sm">Checking Identity…</div>
        </div>
    </div>

    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_dm.js"></script>
    <script src="js/ui_server.js"></script>

    <script>
        async function loadInbox() {
            const im = window.cromAuth;
            const list = document.getElementById('inbox-list');

            if (!im || !im.keyPair) {
                await new Promise(r => setTimeout(r, 1000));
                if (!im || !im.keyPair) {
                    list.innerHTML = `
                        <div class="text-center py-12">
                            <span class="text-4xl mb-3 block">🔒</span>
                            <p class="text-gray-400 mb-4">Login to decrypt your messages</p>
                            <button onclick="showLogin()" class="px-5 py-2 rounded-lg bg-crom text-black font-semibold text-sm hover:opacity-90 transition">Login / Sign Up</button>
                        </div>`;
                    return;
                }
            }

            list.innerHTML = '<div class="text-center text-gray-500 py-6 text-sm">Decrypting messages… 📡</div>';

            try {
                const msgs = await window.dmManager.fetchInbox();
                if (!msgs || msgs.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 py-10">No encrypted messages found.</div>';
                    return;
                }

                list.innerHTML = '';
                msgs.forEach(msg => {
                    const hue = parseInt(msg.sender.substring(0, 2), 16);
                    list.innerHTML += `
                        <div class="bg-green-500/[0.04] border border-green-500/20 rounded-xl p-4 hover:border-green-500/30 transition">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-3 pb-3 border-b border-green-500/10">
                                <a href="profile.html?pubkey=${msg.sender}" class="flex items-center gap-2">
                                    <span class="w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-bold text-white" style="background: hsl(${hue}, 55%, 45%)">${msg.sender.substring(0, 2).toUpperCase()}</span>
                                    <span class="text-xs font-mono text-green-400">${msg.sender.substring(0, 10)}…</span>
                                </a>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs text-gray-500">${new Date(msg.sent_at).toLocaleString()}</span>
                                    <a href="chat.html?peer=${msg.sender}" class="px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-gray-300 hover:bg-white/10 transition">Reply 💬</a>
                                </div>
                            </div>
                            <div class="text-sm text-gray-200 font-mono whitespace-pre-wrap leading-relaxed">${msg.content}</div>
                        </div>`;
                });
            } catch (e) {
                list.innerHTML = `<div class="text-center text-red-400 py-8">${e.message}</div>`;
            }
        }

        async function send() {
            const recip = document.getElementById('recipient').value.trim();
            const text = document.getElementById('message').value;
            if (!recip || !text) return alert('Fill all fields');
            const success = await window.dmManager.sendDM(recip, text);
            if (success) {
                document.getElementById('message').value = '';
                alert('Message encrypted and sent!');
            }
        }

        setTimeout(loadInbox, 500);
    </script>
</body>

</html>
