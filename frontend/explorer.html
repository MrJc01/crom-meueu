<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer | Crom Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { crom: { DEFAULT: '#00d2ff', light: '#3a7bd5' }, surface: { 900: '#0a0a0f', 700: '#12121a' } }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #0f0c29 40%, #1a1030 100%);
            background-attachment: fixed;
        }
    </style>
</head>

<body class="font-sans text-gray-100 min-h-screen">

    <nav
        class="sticky top-0 z-50 flex items-center justify-between px-4 md:px-8 py-4 bg-surface-900/80 backdrop-blur-xl border-b border-white/5">
        <a href="index.html"
            class="text-gray-400 hover:text-white transition text-sm flex items-center gap-1"><span>←</span> Feed</a>
        <span class="text-lg font-bold bg-gradient-to-r from-crom to-crom-light bg-clip-text text-transparent">🔍 Node
            Explorer</span>
        <div class="w-16"></div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-6">
        <p class="text-gray-500 text-sm mb-4">Raw inspection of the local Crom Node database.</p>

        <!-- Toolbar -->
        <div class="flex flex-wrap items-center gap-3 bg-white/[0.03] border border-white/[0.06] rounded-xl p-3 mb-6">
            <select id="kind-filter"
                class="bg-surface-700 border border-white/10 text-gray-300 text-sm rounded-lg px-3 py-2 focus:border-crom/50 focus:outline-none">
                <option value="">All Kinds</option>
                <option value="text">Text</option>
                <option value="video">Video</option>
                <option value="article">Article</option>
                <option value="image">Image</option>
                <option value="encrypted_dm">Encrypted DM</option>
            </select>
            <button onclick="refresh()"
                class="px-4 py-2 rounded-lg bg-crom text-black font-semibold text-sm hover:opacity-90 transition">Refresh</button>
            <span id="status" class="ml-auto text-xs text-gray-500">Waiting…</span>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-xl border border-white/[0.06]">
            <table class="w-full text-sm">
                <thead class="bg-white/[0.03]">
                    <tr>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Kind</th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">ID
                        </th>
                        <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            Author</th>
                        <th
                            class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden sm:table-cell">
                            Time</th>
                        <th
                            class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider hidden md:table-cell">
                            Payload</th>
                    </tr>
                </thead>
                <tbody id="node-rows" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_server.js"></script>

    <script>
        const kindColors = {
            text: 'bg-blue-500/20 text-blue-400', video: 'bg-red-500/20 text-red-400',
            article: 'bg-purple-500/20 text-purple-400', image: 'bg-pink-500/20 text-pink-400',
            encrypted_dm: 'bg-green-500/20 text-green-400', link: 'bg-yellow-500/20 text-yellow-400'
        };

        async function refresh() {
            const list = document.getElementById('node-rows');
            const status = document.getElementById('status');
            const kind = document.getElementById('kind-filter').value;
            list.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">Fetching nodes…</td></tr>';

            const filters = {};
            if (kind) filters.kinds = [kind];

            try {
                const nodes = await window.cromClient.query(filters);
                status.textContent = `${nodes.length} nodes found`;
                list.innerHTML = '';

                if (nodes.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">No nodes found</td></tr>';
                    return;
                }

                nodes.forEach(node => {
                    const colorClass = kindColors[node.kind] || 'bg-gray-500/20 text-gray-400';
                    const payloadStr = JSON.stringify(node.payload || {});
                    list.innerHTML += `
                        <tr class="hover:bg-white/[0.02] transition cursor-pointer" onclick="window.location='thread.html?id=${node.id}'">
                            <td class="px-4 py-3"><span class="px-2 py-1 rounded-md text-xs font-medium ${colorClass}">${node.kind}</span></td>
                            <td class="px-4 py-3 font-mono text-xs text-gray-400">${(node.id || '').substring(0, 8)}…</td>
                            <td class="px-4 py-3"><a href="profile.html?pubkey=${node.author_pubkey}" class="text-crom hover:underline text-xs font-mono">${(node.author_pubkey || '').substring(0, 10)}…</a></td>
                            <td class="px-4 py-3 text-xs text-gray-500 hidden sm:table-cell">${new Date(node.claimed_at).toLocaleString()}</td>
                            <td class="px-4 py-3 text-xs text-gray-600 font-mono truncate max-w-[300px] hidden md:table-cell" title="${payloadStr.replace(/"/g, '&quot;')}">${payloadStr}</td>
                        </tr>`;
                });
            } catch (e) {
                list.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-red-400">${e.message}</td></tr>`;
            }
        }

        document.getElementById('kind-filter').onchange = refresh;
        document.addEventListener('DOMContentLoaded', () => setTimeout(refresh, 300));
    </script>
</body>

</html>
