<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home / X Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Twitter Specific Overrides */
        body {
            background: #000000 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .x-layout {
            display: grid;
            grid-template-columns: 275px 600px 350px;
            gap: 20px;
            max-width: 1250px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Nav Sidebar */
        .x-sidebar-left {
            padding: 20px;
            border-right: 1px solid #2f3336;
        }

        .x-menu-item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            font-size: 20px;
            border-radius: 9999px;
            width: fit-content;
            cursor: pointer;
            transition: background 0.2s;
            color: #e7e9ea;
            margin-bottom: 8px;
        }

        .x-menu-item:hover {
            background: rgba(231, 233, 234, 0.1);
        }

        .x-logo {
            font-size: 30px;
            padding-left: 15px;
            margin-bottom: 20px;
        }

        /* Main Feed */
        .x-feed {
            border-right: 1px solid #2f3336;
        }

        .x-header {
            padding: 15px;
            border-bottom: 1px solid #2f3336;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        /* Tweet Card */
        .tweet {
            padding: 15px;
            border-bottom: 1px solid #2f3336;
            display: flex;
            gap: 12px;
            transition: background 0.2s;
        }

        .tweet:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .avi {
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 50%;
        }

        .tweet-header {
            display: flex;
            gap: 5px;
            color: #71767b;
            font-size: 15px;
        }

        .tweet-name {
            color: #e7e9ea;
            font-weight: 700;
        }

        .tweet-body {
            margin-top: 4px;
            color: #e7e9ea;
            font-size: 15px;
            line-height: 20px;
        }

        .tweet-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            max-width: 425px;
            color: #71767b;
        }

        .action-item {
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-item:hover {
            color: #1d9bf0;
        }

        .action-like:hover {
            color: #f91880;
        }

        /* Right Sidebar */
        .x-sidebar-right {
            padding: 20px 0 0 20px;
        }

        .x-card {
            background: #16181c;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .trend-item {
            margin-bottom: 20px;
        }

        .trend-meta {
            color: #71767b;
            font-size: 13px;
        }

        .trend-title {
            color: #e7e9ea;
            font-weight: 700;
        }

        @media (max-width: 1000px) {
            .x-layout {
                grid-template-columns: 80px 1fr 0;
            }

            .x-sidebar-right {
                display: none;
            }

            .x-menu-text {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="x-layout">
        <!-- Left Sidebar -->
        <div class="x-sidebar-left">
            <div class="x-logo">𝕏</div>
            <div class="x-menu-item"><span style="margin-right:20px">🏠</span> <span class="x-menu-text">Home</span>
            </div>
            <div class="x-menu-item"><span style="margin-right:20px">🔍</span> <span class="x-menu-text">Explore</span>
            </div>
            <div class="x-menu-item"><span style="margin-right:20px">🔔</span> <span
                    class="x-menu-text">Notifications</span></div>
            <div class="x-menu-item"><span style="margin-right:20px">✉️</span> <span class="x-menu-text">Messages</span>
            </div>
            <div
                style="background:#1d9bf0; color:white; border-radius:99px; padding:15px; text-align:center; margin-top:20px; font-weight:bold; font-size:17px; cursor:pointer">
                Post</div>
        </div>

        <!-- Main Feed -->
        <div class="x-feed">
            <div class="x-header">
                <h2 style="font-size:20px; margin:0; background:none; -webkit-text-fill-color: #e7e9ea">For you</h2>
            </div>
            <div id="feed">
                <div style="padding:40px; text-align:center; color:#71767b">Loading posts...</div>
            </div>
        </div>

        <!-- Right Trends -->
        <div class="x-sidebar-right">
            <div class="x-card">
                <h3 style="margin-top:0; color:#e7e9ea">What's happening</h3>
                <div class="trend-item">
                    <div class="trend-meta">Technology • Trending</div>
                    <div class="trend-title">#CromProtocol</div>
                    <div class="trend-meta">52.4K posts</div>
                </div>
                <div class="trend-item">
                    <div class="trend-meta">Politics • Trending</div>
                    <div class="trend-title">Decentralization</div>
                    <div class="trend-meta">12.1K posts</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_dm.js"></script>
    <script src="js/ui_server.js"></script>
    <script src="js/api.js"></script>
    <script>
        fetchNodes({ kinds: ["text"] }).then(nodes => {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            nodes.forEach(node => {
                const authorShort = node.author_pubkey.substring(0, 8);
                const div = document.createElement('div');
                div.className = 'tweet';

                // Deterministic Avatar Color
                const hue = parseInt(node.author_pubkey.substring(0, 2), 16);

                div.innerHTML = `
                    <a href="profile.html?pubkey=${node.author_pubkey}" style="text-decoration:none">
                        <div class="avi" style="background: hsl(${hue}, 60%, 50%)"></div>
                    </a>
                    <div style="flex:1">
                        <div class="tweet-header">
                            <a href="profile.html?pubkey=${node.author_pubkey}" class="tweet-name" style="text-decoration:none; color:inherit">User ${authorShort}</a>
                            <span>@${authorShort}</span>
                            <span>· ${formatDate(node.claimed_at).split(' ')[1]}</span>
                        </div>
                        <div class="tweet-body">
                            ${node.payload.content || node.payload.text || "No content"}
                        </div>
                        <div class="tweet-actions">
                            <div class="action-item btn-disabled">💬 0</div>
                            <div class="action-item btn-disabled">🔁 0</div>
                            <div class="action-item btn-disabled">❤️ 0</div>
                            <div class="action-item btn-disabled">📊 0</div>
                        </div>
                    </div>
                `;
                feed.appendChild(div);
            });
        });
    </script>
</body>

</html>
