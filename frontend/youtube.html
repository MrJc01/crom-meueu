<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tube Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* YouTube Override */
        body {
            background: #0f0f0f !important;
            padding: 0 !important;
        }

        .container {
            max-width: 100% !important;
            padding: 0 !important;
        }

        .yt-nav {
            height: 56px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .yt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 24px;
        }

        .yt-card {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .yt-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .yt-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 3px 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .yt-meta {
            display: flex;
            margin-top: 12px;
            gap: 12px;
        }

        .yt-avi {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }

        .yt-info {
            display: flex;
            flex-direction: column;
        }

        .yt-title {
            color: #f1f1f1;
            font-weight: 500;
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .yt-sub {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="yt-nav">
        <div style="display:flex; align-items:center; gap:20px; color:white; font-size:20px;">
            <span>☰</span>
            <span style="font-weight:700; letter-spacing:-1px">YouTube <sup
                    style="font-weight:400; font-size:10px">BR</sup></span>
        </div>
        <div style="flex:1; display:flex; justify-content:center; max-width:600px">
            <input type="text" placeholder="Search"
                style="width:100%; background:#121212; border:1px solid #303030; padding:10px 20px; border-radius:40px; color:white;">
        </div>
        <div style="width:100px; display:flex; justify-content:flex-end; gap:20px; color:white">
            <span>📹</span><span>🔔</span>
        </div>
    </div>

    <div id="feed" class="yt-grid">
        <!-- Content -->
    </div>

    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/crypto_auth.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_dm.js"></script>
    <script src="js/ui_server.js"></script>
    <script src="js/api.js"></script>
    <script>
        fetchNodes({ kinds: ["video"] }).then(nodes => {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            nodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'yt-card';
                const thumb = node.payload.thumbnail || "https://placehold.co/320x180/222/FFF?text=Video";
                const hue = parseInt(node.author_pubkey.substring(0, 2), 16);

                div.onclick = () => window.location.href = `watch.html?id=${node.id}`;
                div.innerHTML = `
                    <div class="yt-thumb">
                        <img src="${thumb}" onerror="this.onerror=null;this.src='https://placehold.co/320x180/000/FFF?text=Image+Error';">
                        <div class="duration">12:45</div>
                    </div>
                    <div class="yt-meta">
                        <a href="profile.html?pubkey=${node.author_pubkey}">
                            <div class="yt-avi" style="background: hsl(${hue}, 60%, 50%)"></div>
                        </a>
                        <div class="yt-info">
                            <div class="yt-title">${node.payload.title || "Untitled Video"}</div>
                            <a href="profile.html?pubkey=${node.author_pubkey}" class="yt-sub" style="text-decoration:none">Channel ${node.author_pubkey.substring(0, 8)}</a>
                            <div class="yt-sub">${Math.floor(Math.random() * 500)}K views • ${getTimeAgo(node.claimed_at)}</div>
                        </div>
                    </div>
                `;
                feed.appendChild(div);
            });
        });

        function getTimeAgo(dateString) {
            const diff = (new Date() - new Date(dateString)) / 1000;
            if (diff < 3600) return Math.floor(diff / 60) + " minutes ago";
            return Math.floor(diff / 3600) + " hours ago";
        }
    </script>
</body>

</html>
