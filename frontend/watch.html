<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Watch / Tube</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0f0f0f !important;
        }

        .watch-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Video Player */
        .primary-col {
            display: flex;
            flex-direction: column;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-info {
            margin-top: 15px;
            color: #f1f1f1;
        }

        .video-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .channel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid #272727;
        }

        .ch-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ch-avi {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
        }

        .ch-name {
            font-weight: 700;
            font-size: 16px;
        }

        .ch-subs {
            font-size: 12px;
            color: #aaa;
        }

        .sub-btn {
            background: white;
            color: black;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .desc-box {
            background: #272727;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Sidebar */
        .rec-item {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .rec-thumb {
            width: 168px;
            height: 94px;
            background: #333;
            border-radius: 8px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .rec-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rec-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rec-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .rec-meta {
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 1000px) {
            .watch-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="watch-layout">
        <div class="primary-col" id="main-content">
            <div style="height:500px; display:flex; align-items:center; justify-content:center; color:#aaa">Loading
                Video...</div>
        </div>
        <div class="secondary-col">
            <h3 style="margin-top:0">Up Next</h3>
            <div id="sidebar-rec"></div>
        </div>
    </div>

    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_server.js"></script>
    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const nodeId = params.get('id');

        if (!nodeId) {
            window.location.href = 'youtube.html';
        }

        // 1. Fetch Main Video
        fetchNodes({ ids: [nodeId] }).then(nodes => {
            if (nodes.length === 0) return;
            const node = nodes[0];
            const main = document.getElementById('main-content');
            const hue = parseInt(node.author_pubkey.substring(0, 2), 16);
            const thumb = node.payload.thumbnail || "";

            main.innerHTML = `
                <div class="video-container">
                    <video src="${node.payload.url || 'https://www.w3schools.com/html/mov_bbb.mp4'}" controls autoplay></video>
                </div>
                <div class="video-info">
                    <div class="video-title">${node.payload.title || "Untitled Video"}</div>
                    <div class="channel-row">
                        <div class="ch-info">
                            <div class="ch-avi" style="background: hsl(${hue}, 60%, 50%)"></div>
                            <div>
                                <div class="ch-name">Channel ${node.author_pubkey.substring(0, 8)}</div>
                                <div class="ch-subs">1.2M subscribers</div>
                            </div>
                        </div>
                        <div style="display:flex; gap:10px">
                             <button style="background:#272727; color:white; border:none; padding:10px 16px; border-radius:20px; font-weight:600">👍 12K</button>
                             <button class="sub-btn">Subscribe</button>
                        </div>
                    </div>
                    <div class="desc-box">
                        <span style="font-weight:700">245K views • ${new Date(node.claimed_at).toLocaleDateString()}</span><br><br>
                        ${node.payload.content || "No description provided."}
                        <br><br>
                        <span style="color:#aaa">ID: ${node.id}</span>
                    </div>
                </div>
            `;
        });

        // 2. Fetch Sidebar Recs
        fetchNodes({ kinds: ["video"], limit: 10 }).then(nodes => {
            const side = document.getElementById('sidebar-rec');
            nodes.forEach(node => {
                if (node.id === nodeId) return; // Skip current
                const div = document.createElement('div');
                div.className = 'rec-item';
                div.onclick = () => window.location.href = `watch.html?id=${node.id}`;

                const thumb = node.payload.thumbnail || "https://placehold.co/168x94/222/FFF?text=Video";

                div.innerHTML = `
                    <div class="rec-thumb">
                        <img src="${thumb}" onerror="this.onerror=null;this.src='https://placehold.co/168x94/000/FFF?text=Error';">
                    </div>
                    <div class="rec-info">
                        <div class="rec-title">${node.payload.title || "Untitled"}</div>
                        <div class="rec-meta">Channel ${node.author_pubkey.substring(0, 6)}</div>
                        <div class="rec-meta">15K views • ${formatDate(node.claimed_at).split(' ')[0]}</div>
                    </div>
                `;
                side.appendChild(div);
            });
        });
    </script>
</body>

</html>
