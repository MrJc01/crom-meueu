<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Secure Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            padding-top: 20px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
        }

        .chat-window {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            overflow-y: scroll;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-input-area {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 0 0 12px 12px;
            border: 1px solid #333;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }

        .msg-sent {
            align-self: flex-end;
            background: #00d2ff;
            color: black;
            border-bottom-right-radius: 4px;
        }

        .msg-received {
            align-self: flex-start;
            background: #333;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .server-mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            background: #111;
            padding: 5px;
            border-radius: 8px;
        }

        .mode-option {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            color: #888;
        }

        .mode-option.active {
            background: #333;
            color: white;
            font-weight: bold;
        }

        .direct-ip-input {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #00ff41;
            padding: 5px;
            font-family: monospace;
            margin-bottom: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container chat-container">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:10px">
                <a href="inbox.html" style="color:white; text-decoration:none">⬅️</a>
                <div class="profile-avi" style="width:40px; height:40px; margin:0;" id="peer-avi"></div>
                <div id="peer-name">Chat with ...</div>
            </div>
            <div style="font-size:12px; color:#00ff41">🔒 E2EE Active</div>
        </div>

        <div class="chat-window" id="chat-feed">
            <div style="text-align:center; color:#666">Loading Secure Tunnel...</div>
        </div>

        <div class="chat-input-area">
            <div class="server-mode-selector">
                <div class="mode-option active" id="mode-server" onclick="setMode('server')">☁️ Via Home Server</div>
                <div class="mode-option" id="mode-direct" onclick="setMode('direct')">🚀 Carta Direta (P2P)</div>
            </div>
            <input type="text" id="direct-ip" class="direct-ip-input"
                placeholder="Target IP (e.g., http://192.168.0.5:8080)">

            <div style="display:flex; gap:10px">
                <input type="text" id="msg-input" placeholder="Type a secret message..."
                    style="flex:1; margin:0; border-radius:30px; padding:12px 20px;">
                <button onclick="sendMsg()"
                    style="border-radius:50%; width:50px; height:50px; padding:0; display:flex; align-items:center; justify-content:center">➤</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_dm.js"></script>
    <script src="js/ui_server.js"></script>
    <script src="js/api.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const peerPub = params.get('peer');
        let currentMode = 'server';
        let directIP = localStorage.getItem('last_direct_ip') || '';

        if (!peerPub) window.location.href = 'inbox.html';

        // Setup Header
        const hue = parseInt(peerPub.substring(0, 2), 16);
        document.getElementById('peer-avi').style.background = `hsl(${hue}, 60%, 50%)`;
        document.getElementById('peer-name').innerText = `Chat with @${peerPub.substring(0, 8)}...`;
        document.getElementById('direct-ip').value = directIP;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-option').forEach(el => el.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');

            const ipInput = document.getElementById('direct-ip');
            ipInput.style.display = mode === 'direct' ? 'block' : 'none';
        }

        async function loadChat() {
            // Re-use Inbox Logic but filter locally for Peer
            // Ideally backend supports sender filter, but tag filter is for RECIPIENT.
            // So we fetch "My Inbox" and filter messages FROM peer.
            // AND we fetch "Sent by Me" with tag "recipient:PEER".

            const msgs = await window.dmManager.fetchInbox(); // Returns messages TO me.
            const mySent = []; // TODO: We need a way to fetch messages I sent. Backend filter author=me & tag=recipient:PEER.

            // For MVP, we only show what I received in this view + what I JUST sent (in memory/UI).
            // Fetching sent messages requires new DMManager function.

            const chatFeed = document.getElementById('chat-feed');
            chatFeed.innerHTML = '';

            // Sort by time
            msgs.sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));

            msgs.forEach(msg => {
                if (msg.sender !== peerPub) return;
                appendBubble(msg.content, 'received');
            });
        }

        function appendBubble(text, type) {
            const div = document.createElement('div');
            div.className = `msg-bubble msg-${type}`;
            div.innerText = text;
            document.getElementById('chat-feed').appendChild(div);
            // Scroll to bottom
            const feed = document.getElementById('chat-feed');
            feed.scrollTop = feed.scrollHeight;
        }

        async function sendMsg() {
            const text = document.getElementById('msg-input').value;
            if (!text) return;

            let success = false;

            if (currentMode === 'direct') {
                const target = document.getElementById('direct-ip').value;
                if (!target) return alert("Enter Target IP");
                localStorage.setItem('last_direct_ip', target);

                // Hack DMManager to use custom URL
                const originalServer = window.serverManager.currentServer;
                window.serverManager.currentServer = target; // Temporarily Switch

                try {
                    success = await window.dmManager.sendDM(peerPub, text);
                } finally {
                    window.serverManager.currentServer = originalServer; // Restore
                }

                if (success) {
                    appendBubble(text + " (Direct 🚀)", 'sent');
                }
            } else {
                success = await window.dmManager.sendDM(peerPub, text);
                if (success) {
                    appendBubble(text, 'sent');
                }
            }

            if (success) document.getElementById('msg-input').value = '';
        }

        // Poll for new messages every 5s
        setInterval(loadChat, 5000);
        loadChat();
    </script>
</body>

</html>
