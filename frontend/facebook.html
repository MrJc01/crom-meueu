<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Face Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Facebook Overrides */
        body {
            background: #18191a !important;
            font-family: Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 680px !important;
            margin: 0 auto;
            padding-top: 20px;
        }

        .fb-card {
            background: #242526;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #3e4042;
            overflow: hidden;
        }

        .fb-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fb-avi {
            width: 40px;
            height: 40px;
            background: #444;
            border-radius: 50%;
        }

        .fb-name {
            color: #e4e6eb;
            font-weight: 600;
            font-size: 15px;
        }

        .fb-time {
            color: #b0b3b8;
            font-size: 13px;
        }

        .fb-content {
            color: #e4e6eb;
            font-size: 15px;
            padding: 4px 16px 16px 16px;
        }

        .fb-media {
            width: 100%;
            display: block;
        }

        .fb-stats {
            padding: 10px 16px;
            border-bottom: 1px solid #3e4042;
            display: flex;
            justify-content: space-between;
            color: #b0b3b8;
            font-size: 14px;
        }

        .fb-actions {
            display: flex;
            padding: 4px;
        }

        .fb-btn {
            flex: 1;
            padding: 8px;
            color: #b0b3b8;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .fb-btn:hover {
            background: #3a3b3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="feed">
            <!-- Content -->
        </div>
    </div>

    <script src="js/lib/nacl.min.js"></script>
    <script src="js/lib/nacl-util.min.js"></script>
    <script src="js/lib/ed2curve.min.js"></script>
    <script src="js/sdk/auth.js"></script>
    <script src="js/sdk/client.js"></script>
    <script src="js/ui_login.js"></script>
    <script src="js/ui_dm.js"></script>
    <script src="js/ui_server.js"></script>
    <script src="js/api.js"></script>
    <script>
        fetchNodes({}).then(nodes => {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            nodes.forEach(node => {
                const div = document.createElement('div');
                div.className = 'fb-card';
                div.style.cursor = 'pointer';
                div.onclick = (e) => {
                    if (!e.target.closest('.fb-btn') && !e.target.closest('video')) {
                        window.location.href = `thread.html?id=${node.id}`;
                    }
                };

                const hue = parseInt(node.author_pubkey.substring(0, 2), 16);

                let mediaHtml = '';
                if (node.kind === 'video') {
                    mediaHtml = `<video src="${node.payload.url || 'https://www.w3schools.com/html/mov_bbb.mp4'}" controls class="fb-media" style="margin-top:10px"></video>`;
                }

                div.innerHTML = `
                    <div class="fb-header">
                        <div class="fb-avi" style="background: hsl(${hue}, 60%, 50%)"></div>
                        <div>
                            <div class="fb-name">User ${node.author_pubkey.substring(0, 8)}</div>
                            <div class="fb-time">${new Date(node.claimed_at).toLocaleString()} · 🌎</div>
                        </div>
                    </div>
                    <div class="fb-content">
                        ${node.payload.content || node.payload.title || "Shared a post"}
                        ${mediaHtml}
                    </div>
                    <div class="fb-stats">
                        <span>👍 ❤️ 0</span>
                        <span>0 Comments</span>
                    </div>
                    <div class="fb-actions">
                        <div class="fb-btn btn-disabled">Like</div>
                        <div class="fb-btn btn-disabled">Comment</div>
                        <div class="fb-btn btn-disabled">Share</div>
                    </div>
                `;
                feed.appendChild(div);
            });
        });
    </script>
</body>

</html>
